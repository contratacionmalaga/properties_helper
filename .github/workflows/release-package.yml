name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          if [[ -z "$TAG" || -z "$VERSION" || "$TAG" == "$VERSION" ]]; then
            echo "Release tag must use v<version> format, for example v1.2.3" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-releases
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven and Dependency Check data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/dependency-check-data
          key: maven-release-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-release-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Configure Maven private repositories
        shell: bash
        env:
          MAVEN_PACKAGE_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          MAVEN_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server><id>github</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PUBLISH_TOKEN}</password></server>
              <server><id>github-releases</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PUBLISH_TOKEN}</password></server>
              <server><id>github-snapshots</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PUBLISH_TOKEN}</password></server>
              <server><id>github-jarios-parent</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PACKAGE_TOKEN}</password></server>
              <server><id>github-email-helper</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PACKAGE_TOKEN}</password></server>
              <server><id>github-properties-helper</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PACKAGE_TOKEN}</password></server>
              <server><id>github-version-helper</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PACKAGE_TOKEN}</password></server>
              <server><id>github-encrypt-helper</id><username>${GITHUB_ACTOR}</username><password>${MAVEN_PACKAGE_TOKEN}</password></server>
            </servers>
            <profiles>
              <profile>
                <id>github-private-packages</id>
                <repositories>
                  <repository><id>github-jarios-parent</id><url>https://maven.pkg.github.com/contratacionmalaga/jarios-parent</url></repository>
                  <repository><id>github-email-helper</id><url>https://maven.pkg.github.com/contratacionmalaga/email_helper</url></repository>
                  <repository><id>github-properties-helper</id><url>https://maven.pkg.github.com/contratacionmalaga/properties_helper</url></repository>
                  <repository><id>github-version-helper</id><url>https://maven.pkg.github.com/contratacionmalaga/version_helper</url></repository>
                  <repository><id>github-encrypt-helper</id><url>https://maven.pkg.github.com/contratacionmalaga/encrypt_helper</url></repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>github-private-packages</activeProfile></activeProfiles>
          </settings>
          EOF

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Verify release version
        shell: bash
        run: |
          PROJECT_VERSION="$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$PROJECT_VERSION" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match pom.xml version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: ./mvnw -B -ntp clean verify

      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp deploy

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "properties-helper ${{ steps.release.outputs.version }}" \
            --notes "Release properties-helper ${{ steps.release.outputs.version }}."

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" target/*.jar --clobber
