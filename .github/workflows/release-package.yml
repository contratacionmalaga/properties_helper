name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          if [[ -z "$TAG" || -z "$VERSION" || "$TAG" == "$VERSION" ]]; then
            echo "Release tag must use v<version> format, for example v1.2.3" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-releases
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven and Dependency Check data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/dependency-check-data
          key: maven-release-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-release-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          publish-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Set up project artifacts
        uses: ./.github/actions/setup-project-artifacts

      - name: Verify release version
        shell: bash
        run: |
          PROJECT_VERSION="$(sed -n '0,/<packaging>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml | tail -n 1)"
          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not resolve project version from pom.xml" >&2
            exit 1
          fi
          if [[ "$PROJECT_VERSION" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match pom.xml version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: ./mvnw -B -ntp clean verify

      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp deploy

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ github.event.repository.name }} ${{ steps.release.outputs.version }}" \
            --notes "Release ${{ github.event.repository.name }} ${{ steps.release.outputs.version }}."

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if compgen -G "target/*.jar" > /dev/null; then
            gh release upload "${{ steps.release.outputs.tag }}" target/*.jar --clobber
          else
            echo "No JAR artifacts found to upload."
          fi
